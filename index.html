<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<style>html,body{height:100%}img{max-width:100%}[hidden]{display:none!important}:root{color-scheme:light}</style>
</head>
<body>
<title>Dheeraj &amp; Yash Diet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Mulish:wght@400;700;800&display=swap">
<style>
/* Layout: mobile-first app shell — sticky top bar (person switch), scrolling view, bottom tab bar */
:root{
  --bg:#f4f3ee; --surface:#ffffff; --surface-2:#ecebe3; --fg:#22251f; --muted:#64695b;
  --line:#dddbd1; --accent:#2f7d4f; --accent-soft:#e2efe4;
  --p1:#c2663a; --p1-soft:#f6e7dd; --p2:#3a6ea5; --p2-soft:#dfe9f3;
  --good:#2f7d4f; --warn:#b5781a; --warn-soft:#f7edd7; --bad:#c0463a; --bad-soft:#f6e0dd;
  --prot:#c2663a; --fib:#2f7d4f; --cal:#3a6ea5;
  --display:"Fraunces",Georgia,serif; --body:"Mulish","Segoe UI",system-ui,sans-serif;
  --r:14px; --sh:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1f2225; --surface-2:#272b2e; --fg:#ebeae4; --muted:#9aa093;
  --line:#343a3a; --accent:#6bbf8a; --accent-soft:#1e3327;
  --p1:#e0956a; --p1-soft:#352620; --p2:#7fb0e0; --p2-soft:#1c2b39;
  --good:#6bbf8a; --warn:#e0b65a; --warn-soft:#332a14; --bad:#e58d82; --bad-soft:#38201e;
  --prot:#e0956a; --fib:#6bbf8a; --cal:#7fb0e0;
  --sh:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1f2225; --surface-2:#272b2e; --fg:#ebeae4; --muted:#9aa093;
  --line:#343a3a; --accent:#6bbf8a; --accent-soft:#1e3327;
  --p1:#e0956a; --p1-soft:#352620; --p2:#7fb0e0; --p2-soft:#1c2b39;
  --good:#6bbf8a; --warn:#e0b65a; --warn-soft:#332a14; --bad:#e58d82; --bad-soft:#38201e;
  --prot:#e0956a; --fib:#6bbf8a; --cal:#7fb0e0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased}
.app{max-width:720px;margin:0 auto;min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:21}
.topbar-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-family:var(--display);font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:7px}
.brand .leaf{color:var(--accent)}
.switch{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.switch button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:.82rem;padding:6px 14px;border-radius:999px;transition:.15s}
.switch button.on[data-p="dheeraj"]{background:var(--p1);color:#fff}
.switch button.on[data-p="yash"]{background:var(--p2);color:#fff}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:1rem;display:grid;place-items:center}
/* view */
.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.datehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.datehead .d-main{font-family:var(--display);font-size:1.35rem}
.datehead .d-sub{font-size:.8rem;color:var(--muted)}
.navd{border:1px solid var(--line);background:var(--surface);color:var(--fg);width:34px;height:34px;border-radius:10px;font-size:1.1rem;line-height:1}
.chip{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.todaybtn{font-size:.74rem;font-weight:800;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 10px;border-radius:999px}
/* rings */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.ring{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.ring svg{width:76px;height:76px;display:block;margin:0 auto 4px}
.ring .rv{font-weight:800;font-size:1.02rem}
.ring .rl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ring .rt{font-size:.66rem;color:var(--muted)}
.subbars{display:flex;gap:10px;margin:6px 0 16px;font-size:.76rem;color:var(--muted)}
.subbars .sb{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.subbars .bar{height:5px;border-radius:3px;background:var(--surface-2);margin-top:4px;overflow:hidden}
.subbars .bar i{display:block;height:100%;border-radius:3px}
/* banners */
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.banner.good{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.banner b{display:block;margin-bottom:2px}
.topups{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.topups button{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 11px;font-size:.8rem;font-weight:700}
.topups button:before{content:"+ ";color:var(--warn);font-weight:800}
/* meal card */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.meal.taken{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.meal.skipped{opacity:.72}
.meal-h{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.meal-h .slot{font-size:.68rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.meal-h .mname{font-weight:800;font-size:1rem;flex:1;line-height:1.2}
.meal-h .mmac{font-size:.72rem;color:var(--muted);text-align:right;white-space:nowrap}
.meal-h .mmac b{color:var(--prot)}
.statusdot{width:10px;height:10px;border-radius:50%;background:var(--surface-2);flex:none}
.meal.taken .statusdot{background:var(--good)}
.meal.skipped .statusdot{background:var(--bad)}
.items{list-style:none;margin:0;padding:6px 14px}
.items li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.9rem;border-bottom:1px dashed var(--line)}
.items li:last-child{border-bottom:0}
.items .itxt{flex:1}
.items .imac{font-size:.72rem;color:var(--muted);white-space:nowrap}
.info-i{flex:none;width:21px;height:21px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);font-size:.72rem;font-weight:800;line-height:1;display:grid;place-items:center;font-family:var(--display)}
.it-cant{flex:none;width:21px;height:21px;border-radius:50%;border:1px solid var(--bad);color:var(--bad);background:var(--bad-soft);font-size:.7rem;font-weight:800;line-height:1;display:grid;place-items:center}
.items li.it-skip{opacity:.65}
.items li s{color:var(--muted)}
.skiptag{font-size:.62rem;font-weight:800;color:var(--bad);background:var(--bad-soft);padding:1px 6px;border-radius:999px;margin-left:5px;white-space:nowrap}
.swaptag{font-size:.62rem;font-weight:800;color:var(--p2);background:var(--p2-soft);padding:1px 6px;border-radius:999px;margin-left:5px;white-space:nowrap}
.it-undo{margin-left:auto;border:0;background:transparent;color:var(--p2);font-weight:800;font-size:.78rem;text-decoration:underline}
.swapnote{padding:4px 14px 0;font-size:.74rem;color:var(--p2)}
.actions{display:flex;gap:8px;padding:12px 14px}
.actions button{flex:1;border-radius:10px;padding:10px 6px;font-size:.82rem;font-weight:800;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:5px}
.actions .take.on{background:var(--good);border-color:var(--good);color:#fff}
.actions .skip.on{background:var(--bad);border-color:var(--bad);color:#fff}
.actions .cant{color:var(--p2);border-color:color-mix(in srgb,var(--p2) 45%,var(--line))}
.extras{padding:0 14px 12px}
.extras .ex{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);padding:4px 0}
.extras .ex b{color:var(--fg)}
.extras .rm{margin-left:auto;border:0;background:transparent;color:var(--bad);font-weight:800;font-size:1rem}
/* trackers row */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.tile h3{font-family:var(--body);font-weight:800;font-size:.9rem;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.water{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.water .cup{width:22px;height:28px;border:2px solid var(--line);border-radius:3px 3px 6px 6px;position:relative;overflow:hidden}
.water .cup.full{border-color:var(--cal)}
.water .cup.full:after{content:"";position:absolute;inset:0;background:var(--cal);opacity:.85}
.water .wbtns{margin-left:auto;display:flex;gap:6px}
.water .wbtns button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.1rem;font-weight:800}
.supp{display:flex;flex-direction:column;gap:7px}
.supp label{display:flex;align-items:center;gap:9px;font-size:.86rem}
.supp input{width:19px;height:19px;accent-color:var(--accent)}
.weighrow{display:flex;gap:8px;align-items:center}
.weighrow input{flex:1;font-size:1rem;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
.weighrow button{border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:800;border-radius:10px;padding:9px 14px}
.hint{font-size:.76rem;color:var(--muted);margin-top:7px}
/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h .mlabel{font-family:var(--display);font-size:1.25rem}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.dow span{text-align:center;font-size:.66rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cell.empty{border:0;background:transparent}
.cell .dn{font-size:.82rem;font-weight:700}
.cell .pday{font-size:.56rem;color:var(--muted);position:absolute;top:3px;right:5px}
.cell.today{border-color:var(--accent);border-width:2px}
.cell.sel{box-shadow:0 0 0 2px var(--accent) inset}
.cell .cring{width:17px;height:17px}
.cell.future{opacity:.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%}
/* progress */
.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.statbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:var(--sh)}
.statbox .n{font-family:var(--display);font-size:1.7rem;font-weight:600}
.statbox .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{font-family:var(--body);font-weight:800;font-size:1rem;margin-bottom:10px}
.spark{width:100%;height:120px}
.wlist{list-style:none;margin:10px 0 0;padding:0;font-size:.86rem}
.wlist li{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)}
/* guide */
.guide h2{font-size:1.4rem;margin:22px 0 10px}
.guide h2:first-child{margin-top:4px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.gcard h3{font-family:var(--body);font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:8px}
.gcard p{margin:6px 0 0;font-size:.88rem;color:var(--muted)}
.gcard .amt{font-size:.72rem;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;margin-left:auto}
.gtable{width:100%;border-collapse:collapse;font-size:.86rem}
.gtable td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.gtable td:first-child{font-weight:800;white-space:nowrap;padding-right:10px}
/* bottom nav */
/* gym */
:root{--fig:#2b3a32;--eq:#8b9086;--eqfill:#e4e3da;--mbody:#e2e5db;--mm:#c6ccbe;--on-accent:#ffffff;--pl20:#2f6fd0;--pl15:#e3b62f;--pl10:#2f9a52;--pl5:#f3f3ef;--pl2:#d0453b;--pl1:#a9b0b5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fig:#e3eae3;--eq:#7e877e;--eqfill:#2c312e;--mbody:#2b302d;--mm:#40473f;--on-accent:#0f2418}}
:root[data-theme="dark"]{--fig:#e3eae3;--eq:#7e877e;--eqfill:#2c312e;--mbody:#2b302d;--mm:#40473f;--on-accent:#0f2418}
.fg{stroke:var(--fig);stroke-linecap:round;fill:none}
.fh{stroke:var(--p1);stroke-linecap:round;fill:none}
.far{opacity:.33}
.fgf{fill:var(--fig)}
.fhf{fill:var(--p1)}
.eqs{stroke:var(--eq);stroke-linecap:round;fill:none}
.eqf{fill:var(--eqfill);stroke:var(--eq);stroke-width:1.5}
.plate{fill:var(--p2);stroke:var(--fig);stroke-width:1.4}
.hub{fill:var(--fig)}
.cab{stroke:var(--eq);stroke-width:1.4;stroke-dasharray:3 2;fill:none}
.flr{stroke:var(--line);stroke-width:2}
.ghost{opacity:.22}
.anim{display:block}
.anim.big{width:100%;height:auto;max-height:250px}
.anim.sm{width:100%;height:100%}
.mmap{display:block;width:100%;height:auto;max-width:320px;margin:0 auto}
.mmap.mini{max-width:140px}
.mb{fill:var(--mbody)}
.mbs{stroke:var(--mbody);stroke-linecap:round;fill:none}
.mm{fill:var(--mm)}
.mmP{fill:var(--p1)}
.mmS{fill:var(--p1);fill-opacity:.4}
.mline{stroke:var(--mbody);stroke-width:1;fill:none}
.mlab{fill:var(--muted);font-size:8px;font-weight:800;letter-spacing:.08em;text-anchor:middle;font-family:var(--body)}
.mlegend{display:flex;gap:14px;justify-content:center;font-size:.76rem;color:var(--muted);margin:6px 0 8px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.p{background:var(--p1)}
.lg.s{background:var(--p1);opacity:.4}
.mchip{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;margin:0 5px 5px 0}
.mchip.p{background:var(--p1-soft);color:var(--p1)}
.mchip.s{background:var(--surface-2);color:var(--muted)}
.progbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.pb-t{font-weight:800;font-size:.9rem}
.pb-s{font-size:.74rem;color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:.8rem;flex:none}
.btn.big{padding:15px;font-size:1rem;font-weight:800}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hero{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.hero-l{flex:1;min-width:0}
.hero h2{font-size:1.7rem;margin:6px 0 2px}
.hero-m{width:118px;flex:none}
.hero-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.hero-stats b{color:var(--fg)}
.switchw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);margin:14px 0 12px}
.switchw button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 10px;font-weight:800;font-size:.76rem}
.switchw button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.warm{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:11px 13px;font-size:.86rem;margin-bottom:14px}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:var(--sh)}
.exc.done{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.exc-h{display:flex;align-items:center;gap:11px;margin-bottom:8px;cursor:pointer}
.ex-th{flex:none;width:72px;height:58px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ex-mid{flex:1;min-width:0}
.exname{font-weight:800;font-size:1rem;line-height:1.2}
.extarget{font-size:.76rem;color:var(--muted);margin-top:2px}
.ex-sug{font-size:.78rem;margin-top:4px;color:var(--muted)}
.ex-sug.up{color:var(--good)}
.ex-sug.deload{color:var(--warn)}
.ex-more{color:var(--muted);font-size:1.5rem;line-height:1;flex:none}
.prb{font-size:.66rem;font-weight:800;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:999px;white-space:nowrap;vertical-align:2px}
.lastline{font-size:.76rem;color:var(--muted);margin:0 0 9px}
.sets{display:flex;flex-direction:column;gap:7px}
.setrow{display:flex;align-items:center;gap:8px}
.setrow .setn{width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:.72rem;font-weight:800;display:grid;place-items:center;flex:none}
.setrow.done .setn{background:var(--good);color:var(--on-accent)}
.setrow input{flex:1;min-width:0;width:60px;text-align:center;font-size:1rem;padding:9px 6px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
.setrow .x{color:var(--muted);font-weight:700}
.setlog{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:9px;padding:9px 10px;font-weight:800;font-size:.8rem;flex:none;min-width:46px}
.setlog.done{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.addset{margin-top:9px;border:0;background:transparent;color:var(--accent);font-weight:800;font-size:.82rem}
.restday{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 18px;box-shadow:var(--sh)}
.restday .bigemoji{font-size:2.6rem}
.restday h2{font-size:1.6rem;margin:6px 0}
.rd-tips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}

function addDays(s,n){const{y,m,d}=parseD(s);const dt=new Date(Date.UTC(y,m-1,d+n));return todayStr(new Date(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()));}

function resolvedItems(person,date,slot){

 return{relaxed:false,items};

function mealFull2(person,date,slot){const r=resolvedItems(person,date,slot);if(r.relaxed)return r.mac.slice();const t=zero();for(const it of r.items)add(t,itMac(it.ing,it.q));return t;}
function mealSkip2(person,date,slot){const r=resolvedItems(person,date,slot);if(r.relaxed)return zero();const t=zero();for(const it of r.items)if(it.skip)add(t,itMac(it.ing,it.q));return t;}
function dayConsumed(person,date){const r=rec(person,date),t=zero();for(const[slot] of SLOTS){const m=r.meals[slot];if(m&&m.s==="taken")add(t,mealMacros2(person,date,slot));}for(const e of r.extras)add(t,e.mac||boostMac(e.id));return t;}
function daySkipped(person,date){const r=rec(person,date),t=zero();for(const[slot] of SLOTS){const m=r.meals[slot]||{};if(m.s==="skipped")add(t,mealFull2(person,date,slot));else add(t,mealSkip2(person,date,slot));}return t;}
function dayPlanTotal(person,date){const t=zero();for(const[slot] of SLOTS)add(t,mealFull2(person,date,slot));return t;}
function setIO(person,date,slot,key,val){const r=rec(person,date);r.meals[slot]=r.meals[slot]||{s:"pending"};r.meals[slot].io=r.meals[slot].io||{};r.meals[slot].io[key]=val;saveDB();}
function clearIO(person,date,slot,key){const r=rec(person,date);if(r.meals[slot]&&r.meals[slot].io)delete r.meals[slot].io[key];saveDB();}
function mealsTaken(person,date){const r=rec(person,date);let n=0;for(const[s] of SLOTS)if(r.meals[s]&&r.meals[s].s==="taken")n++;return n;}
function mealsDecided(person,date){const r=rec(person,date);let n=0;for(const[s] of SLOTS){const m=r.meals[s];if(m&&(m.s==="taken"||m.s==="skipped"))n++;}return n;}

}

 weights.sort((a,b)=>utc(a.ds)-utc(b.ds));

 html+=`</div>`;

 html+=gymProgressHTML(person);

function weightSpark(weights,person){
 const w=weights.map(x=>x.w),min=Math.min(...w),max=Math.max(...w),pad=(max-min)*0.15||1;
 const lo=min-pad,hi=max+pad,W=320,H=110,n=weights.length;
 const x=i=>n>1?(i/(n-1))*(W-20)+10:W/2, yv=v=>H-10-((v-lo)/(hi-lo))*(H-20);
 let pts=weights.map((p,i)=>`${x(i).toFixed(1)},${yv(p.w).toFixed(1)}`).join(" ");
 let dots=weights.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yv(p.w).toFixed(1)}" r="3" fill="${PEOPLE[person].color}"/>`).join("");
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:120px">
   <polyline points="${pts}" fill="none" stroke="${PEOPLE[person].color}" stroke-width="2.5" stroke-linejoin="round"/>
   ${dots}
   <text x="4" y="12" font-size="9" fill="var(--muted)">${nice(hi)}</text>
   <text x="4" y="${H-2}" font-size="9" fill="var(--muted)">${nice(lo)}</text>
 </svg>`;
}

function vinfoSheet(kind,idx){const v=VARIANTS[kind][idx];infoObj({t:v.name,lead:v.lead,steps:v.steps});}
function swapSheet(slot){
 const person=APP.person,who=PEOPLE[person].who,cur=slotForPlanOrSwap(person,slot);
 const cat=DISH[planForIndex(dayIndex(APP.date))[slot]].cat;
 const opts=POOLS[cat];
 let html=`<div class="sheet-h"><h3>Swap this meal</h3><button class="x" data-act="close">×</button></div>
   <p class="small" style="margin:-4px 0 12px">Missing an ingredient or don't feel like it? Pick a replacement with similar protein. The plan keeps your original for other days.</p>`;
 opts.forEach(id=>{const mac=dishMacros(id,who);html+=`<button class="swapopt ${id===cur?"cur":""}" data-act="doswap" data-slot="${slot}" data-id="${id}">
   <span class="so-n">${DISH[id].name}${id===cur?" · current":""}</span>
   <span class="so-m"><b>${nice(mac[P])}g P</b> · ${nice(mac[F])}g F · ${Math.round(mac[K])} kcal</span></button>`;});
 openSheet(html);
}
function slotForPlanOrSwap(person,slot){const m=rec(person,APP.date).meals[slot];if(m&&m.swap)return m.swap;return planForIndex(dayIndex(APP.date))[slot];}
function itemSheet(slot,key){
 const person=APP.person,date=APP.date,io=((rec(person,date).meals[slot]||{}).io)||{},cur=io[key];
 const kindLabel=key==="salad"?"salad":key==="soup"?"soup":key==="sprouts"?"sprout dish":"sabzi";
 let html=`<div class="sheet-h"><h3>Can't take this item?</h3><button class="x" data-act="close">×</button></div>`;
 if(VARIANTS[key]){
   html+=`<p class="small" style="margin:-4px 0 12px">Pick a different ${kindLabel}, or skip it — the protein &amp; fibre you'd lose is carried over.</p>`;
   html+=`<button class="swapopt" data-act="itemskip" data-slot="${slot}" data-key="${key}"><span class="so-n">Skip it today</span><span class="so-m">carry over</span></button>`;
   const defIdx=pickVariant(key,date,slot).idx;
   VARIANTS[key].forEach((v,i)=>{const on=cur&&cur.vi!=null?cur.vi===i:i===defIdx;html+=`<button class="swapopt ${on?"cur":""}" data-act="itemvar" data-slot="${slot}" data-key="${key}" data-idx="${i}"><span class="so-n">${v.name}${on?" · current":""}</span></button>`;});
 } else {
   const origQ=origQof(person,date,slot,key),origMac=itMac(key,origQ),role=ROLE[key]||"misc";
   html+=`<p class="small" style="margin:-4px 0 12px">Replace <b>${fmtItem(key,origQ)}</b> with something similar, or skip it. Swaps keep your protein close.</p>`;
   html+=`<button class="swapopt" data-act="itemskip" data-slot="${slot}" data-key="${key}"><span class="so-n">Skip it today</span><span class="so-m">carry over <b>${nice(origMac[P])}g P</b> · ${nice(origMac[F])}g F</span></button>`;
   if(cur&&(cur.to||cur.skip))html+=`<button class="swapopt" data-act="itemundo" data-slot="${slot}" data-key="${key}"><span class="so-n">↩ Back to original</span><span class="so-m">${fmtItem(key,origQ)}</span></button>`;
   const by=(role==="protein_main"||role==="protein_snack")?P:K;
   (REPL[role]||[]).filter(x=>x!==key).forEach(rp=>{
     let q=ING[rp].k[by]?origMac[by]/ING[rp].k[by]:origMac[K]/ING[rp].k[K];q=roundQ(rp,q);const mm=itMac(rp,q);const on=cur&&cur.to===rp;
     html+=`<button class="swapopt ${on?"cur":""}" data-act="itemswap" data-slot="${slot}" data-key="${key}" data-to="${rp}" data-q="${q}"><span class="so-n">${fmtItem(rp,q)}${on?" · current":""}</span><span class="so-m"><b>${nice(mm[P])}g P</b> · ${nice(mm[F])}g F · ${Math.round(mm[K])} kcal</span></button>`;
   });
 }
 openSheet(html);
}
function settingsSheet(){
 openSheet(`<div class="sheet-h"><h3>Settings</h3><button class="x" data-act="close">×</button></div>
 <div class="infobody">
   <p class="small">Plan started: <b>${prettyDate(anchor())}</b> (plan day 1). Each person's data is saved on this device only.</p>
   <label style="display:flex;align-items:center;gap:9px;margin:14px 0"><input type="checkbox" id="themeToggle" ${document.documentElement.getAttribute("data-theme")==="dark"?"checked":""} style="width:19px;height:19px;accent-color:var(--accent)"> Force dark mode</label>
   <button class="btn full" data-act="resetstart">Reset start date to today</button>
   <button class="btn full" data-act="backup">Show backup code (copy &amp; keep safe)</button>
   <button class="btn full" data-act="restore">Restore from a backup code</button>
   <button class="btn full danger" data-act="cleardata">Erase all tracking data</button>
   <p class="small" style="margin-top:14px">Backup regularly: your data lives in this browser and can be lost if you clear site data or switch phones. Copy the backup code and paste it on your other device to sync.</p>
 </div>`);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-act]");if(!t)return;
 const act=t.dataset.act,person=APP.person,date=APP.date;
 if(gymClick(act,t,person,date))return;
 if(act==="person"){APP.person=t.dataset.p;saveUI();render();}
 else if(act==="tab"){APP.tab=t.dataset.tab;if(t.dataset.tab==="calendar"){const{y,m}=parseD(APP.date);APP.calMonth={y,m};}render();}
 else if(act==="shift"){APP.date=addDays(date,Number(t.dataset.n));render();}
 else if(act==="gotoday"){APP.date=todayStr();render();}
 else if(act==="status"){const r=rec(person,date),slot=t.dataset.slot,s=t.dataset.s;r.meals[slot]=r.meals[slot]||{};r.meals[slot].s=(r.meals[slot].s===s?"pending":s);saveDB();render();}
 else if(act==="swap"){swapSheet(t.dataset.slot);}
 else if(act==="doswap"){const r=rec(person,date),slot=t.dataset.slot;r.meals[slot]=r.meals[slot]||{s:"pending"};r.meals[slot].swap=t.dataset.id;saveDB();closeSheet();render();}
 else if(act==="unswap"){const r=rec(person,date),slot=t.dataset.slot;if(r.meals[slot])delete r.meals[slot].swap;saveDB();render();}
 else if(act==="info"){infoSheet(t.dataset.ing);}
 else if(act==="vinfo"){vinfoSheet(t.dataset.kind,Number(t.dataset.idx));}
 else if(act==="itemcant"){itemSheet(t.dataset.slot,t.dataset.key);}
 else if(act==="itemskip"){setIO(person,date,t.dataset.slot,t.dataset.key,{skip:true});closeSheet();render();}
 else if(act==="itemswap"){setIO(person,date,t.dataset.slot,t.dataset.key,{to:t.dataset.to,q:Number(t.dataset.q)});closeSheet();render();}
 else if(act==="itemvar"){setIO(person,date,t.dataset.slot,t.dataset.key,{vi:Number(t.dataset.idx)});closeSheet();render();}
 else if(act==="itemundo"){clearIO(person,date,t.dataset.slot,t.dataset.key);closeSheet();render();}
 else if(act==="topup"){const r=rec(person,date);const b=BOOST.find(x=>x.id===t.dataset.b);r.extras.push({id:b.id,label:b.label,mac:b.mac});saveDB();render();}
 else if(act==="rmextra"){const r=rec(person,date);r.extras.splice(Number(t.dataset.i),1);saveDB();render();}
 else if(act==="water"){const r=rec(person,date);r.water=Math.max(0,Math.min(20,r.water+Number(t.dataset.n)));saveDB();render();}
 else if(act==="supp"){const r=rec(person,date);r.supps[t.dataset.k]=!r.supps[t.dataset.k];saveDB();}
 else if(act==="weigh"){const v=parseFloat(document.getElementById("wt").value);if(v>0){rec(person,date).weight=Math.round(v*10)/10;saveDB();render();}}
 else if(act==="pickday"){APP.date=t.dataset.d;APP.tab="today";render();}
 else if(act==="calmove"){let{y,m}=APP.calMonth;m+=Number(t.dataset.n);if(m<1){m=12;y--;}if(m>12){m=1;y++;}APP.calMonth={y,m};render();}
 else if(act==="settings"){settingsSheet();}
 else if(act==="close"){closeSheet();}
 else if(act==="resetstart"){DB._anchor=todayStr();saveDB();closeSheet();render();}
 else if(act==="cleardata"){openSheet(`<div class="sheet-h"><h3>Erase everything?</h3><button class="x" data-act="close">×</button></div><p>This permanently deletes all tracking for both Dheeraj and Yash on this device. This cannot be undone.</p><button class="btn full danger" data-act="clearconfirm">Yes, erase all data</button><button class="btn full" data-act="close">Cancel</button>`);}
 else if(act==="clearconfirm"){DB={};saveDB();closeSheet();APP.date=todayStr();render();}
 else if(act==="backup"){const code=btoa(unescape(encodeURIComponent(JSON.stringify(DB))));openSheet(`<div class="sheet-h"><h3>Backup code</h3><button class="x" data-act="close">×</button></div><p class="small">Copy this and keep it safe (notes, chat to yourself). Paste it into “Restore” on another device to sync.</p><textarea readonly id="bk">${code}</textarea><button class="btn full" data-act="copybk">Copy to clipboard</button>`);}
 else if(act==="copybk"){const ta=document.getElementById("bk");ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>{t.textContent="Copied ✓";},()=>{document.execCommand("copy");t.textContent="Copied ✓";});}catch(_){document.execCommand&&document.execCommand("copy");t.textContent="Copied ✓";}}
 else if(act==="restore"){openSheet(`<div class="sheet-h"><h3>Restore backup</h3><button class="x" data-act="close">×</button></div><p class="small">Paste your backup code here. This replaces the data on this device.</p><textarea id="rs" placeholder="Paste backup code"></textarea><button class="btn full" data-act="dorestore">Restore</button>`);}
 else if(act==="dorestore"){try{const v=document.getElementById("rs").value.trim();const obj=JSON.parse(decodeURIComponent(escape(atob(v))));if(obj&&typeof obj==="object"){DB=obj;saveDB();closeSheet();APP.date=todayStr();render();}}catch(err){alert&&0;const b=document.getElementById("rs");if(b)b.style.borderColor="var(--bad)";}}
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(gymChange(el))return;
 if(el.classList&&(el.classList.contains("win")||el.classList.contains("rin"))){const parts=el.id.split("_"),field=parts[0],ex=parts[1],i=Number(parts[2]),log=exLog(APP.person,APP.date,ex);log.sets[i]=log.sets[i]||{};if(el.value!=="")log.sets[i][field==="w"?"w":"r"]=Number(el.value);saveDB();return;}
 const t=el.closest&&el.closest("[data-act]");if(!t)return;
 if(t.dataset.act==="supp"){const r=rec(APP.person,APP.date);r.supps[t.dataset.k]=t.checked;saveDB();}
 if(t.id==="themeToggle"){document.documentElement.setAttribute("data-theme",t.checked?"dark":"light");}
});

render();
</script>
</body>
</html>
